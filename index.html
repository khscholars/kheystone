<script id="app-data" type="application/json">[{"t": "AI in Latin America Initiative", "c": "Education and Academia", "s": "documenting and mapping the passing of AI regulation in Brazil", "d": "Conducting interviews and an ethnographic studies with members of congress, staffers and AI bill Taskforce members on the process of passing the upcoming regulation and the likely outcome of some measures on the business environment due to compliance requirements.", "k": ["AI regulation", "Brazil", "policy-making"], "e": "2024", "n": "Research, writing, conducting interviewing, coding (the social science type!)", "f": [{"n": "Tomás Guarna", "y": "2022"}, {"n": "Thay Graciano", "y": "2023"}], "p": {"n": "Tomás Guarna", "y": "2022"}, "u": ""}, {"t": "Backcurrent Innovation", "c": "Healthcare and Life Sciences", "s": "A global innovation initiative identifying frugal medical technologies developed in low-resource settings and adapting them for use in U.S. healthcare.", "d": "Backcurrent Innovations seeks to reverse the direction of global innovation by sourcing frugal, high-impact healthcare technologies from developing nations and adapting them for use in U.S. clinical settings. The project challenges a system that often rewards over-engineering and price signaling over practicality, demonstrating that simplicity and cost-efficiency can lower expenses for patients and institutions without compromising safety or outcomes.", "k": ["Frugal Innovation", "Healthcare", "MedTech"], "e": "2025", "n": "I’m in the early ideation and pilot design phase and would love to collaborate with students from engineering, medicine, public policy, or business who are passionate about global health equity, frugal innovation, and healthcare reform.", "f": [{"n": "Neil Upreti", "y": "2025"}], "p": {"n": "Neil Upreti", "y": "2025"}, "u": "https://profiles.stanford.edu/neil-upreti"}, {"t": "Beyond Combustion: Methane to Materials", "c": "Sustainability, Energy and Environmental Science", "s": "Identifying markets and end-use applications for methane-derived carbon nanotubes to support industrial decarbonization.", "d": "Methane pyrolysis converts methane into hydrogen and solid carbon without generating CO2 in the decomposition reaction. Building on my laboratory research experience with carbon nanotube production, this project will bring together scholars across engineering, business, and sustainability to identify a practical use for these materials. By spring, we aim to evaluate one promising application and establish its technical requirements, commercial potential, and lifecycle emissions relative to an existing alternative.", "k": ["Carbon nanotubes", "methane pyrolysis", "advanced materials", "industrial decarbonization", "entrepreneurship"], "e": "2026", "n": "I will contribute my research experience with methane pyrolysis, CNT production, and the energy use and economics of materials production. I would welcome teammates interested in materials engineering,  customer discovery, product design, entrepreneurship, lifecycle assessment, and industrial decarbonization. Scholars from any discipline can contribute through interviews, application research, analysis, and communication. We would also benefit from mentors with experience commercializing advanced materials or working with industrial customers.", "f": [{"n": "David Akanmu", "y": "2024"}], "p": {"n": "David Akanmu", "y": "2024"}, "u": "https://profiles.stanford.edu/david-akanmu"}, {"t": "Beyond Degrees: Closing the Racial Wealth Gap Through Higher Education", "c": "Education and Academia", "s": "Developing research-informed interventions that mobilize higher education’s resources and networks to translate educational access into lasting opportunity and close the racial wealth gap.", "d": "Beyond Degrees explores how universities can translate educational access into lasting opportunity and help close the racial wealth gap. Bringing together research and student perspectives, the initiative will develop interventions that mobilize universities’ resources, networks, and institutional practices to support students’ aspirations and build wealth across generations. The project will design and test an intervention that addresses the financial and professional barriers students face in college and as they move into their careers, especially those entering without family wealth or established professional networks.", "k": ["higher education", "racial wealth gap", "opportunity", "social justice"], "e": "2026", "n": "I would welcome teammates from a wide range of backgrounds, especially those interested in higher education, racial equity, economics, law, business, public policy, and social innovation. Experience in social science research, data analysis, program design, fundraising, or partnership building would help, but curiosity and a willingness to collaborate matter most!", "f": [{"n": "Mia Harris", "y": "2026"}], "p": {"n": "Mia Harris", "y": "2026"}, "u": ""}, {"t": "Beyond the Fields: The Lives Behind Our Food", "c": "NGO/ Nonprofit, Social Impact, and Advocacy", "s": "A collaborative storytelling initiative that brings scholars and farmworkers together to document and share lives beyond the fields, with the goal of building a global network of stories that highlights the people, families, dreams, and communities behind our food.", "d": "Farmworkers are often described as \"essential,\" particularly because of the role they play in putting food on our tables. But farmworkers are not valuable only because of their labor. They are mothers and fathers, sons and daughters, friends, neighbors, community leaders, and people with lives, dreams, and stories that extend far beyond the fields. Beyond the Fields hopes to build lasting partnerships between scholars and farmworker communities through photography, interviews, and collaborative storytelling, beginning in California and eventually expanding into a global initiative that invites others to document and share the lives of agricultural workers in their own communities.", "k": ["Farmworkers", "storytelling", "photography", "community", "global engagement"], "e": "2026", "n": "I am still in the early ideation stage and would love an interdisciplinary team with a range of backgrounds and ideas. Skills in photography, journalism or interviewing, visual storytelling, web design, communications, community organizing, and partnership building would be especially helpful. Spanish-language skills would also be valuable, although I want the project to be inclusive of farmworkers from different linguistic backgrounds. I would also love to connect with scholars from different countries who may have relationships with agricultural communities in their home regions or an interest in helping expand the project internationally. Most importantly, I am looking for people who are excited to work directly and respectfully with farmworker communities and help shape what this project could become.", "f": [{"n": "Gabriel Conejo Gallegos", "y": "2026"}], "p": {"n": "Gabriel Conejo Gallegos", "y": "2026"}, "u": ""}, {"t": "BioSentinel - Biosafety in the age AI", "c": "Healthcare and Life Sciences", "s": "A scholar-led initiative exploring how artificial intelligence can strengthen biosafety by identifying, evaluating, and mitigating risks from emerging biological technologies.", "d": "AI for Biosafety is a scholar-led initiative focused on developing AI methods to identify and mitigate risks from emerging biological technologies. The initiative will launch collaborative research projects in areas such as biological risk assessment and AI-enabled safety evaluation, while building a cross-disciplinary consortium of researchers in AI, biology, medicine, security, and policy to coordinate research, share resources, and shape a broader biosafety agenda.", "k": ["AI", "AI Safety", "Scalable Oversight", "Life Science"], "e": "2026", "n": "We are looking for an interdisciplinary team with experience in machine learning, computational biology, synthetic biology, biosecurity/biosafety, medicine, and science or technology policy. Particularly useful skills include building and evaluating ML models, working with biological datasets, understanding experimental biology and dual-use risks, literature synthesis, and organizing cross-disciplinary collaborations. We are also interested in members who may not have direct biosafety experience but bring strong technical or policy expertise and want to help shape the project from an early stage.", "f": [{"n": "Toby Mao", "y": "2025"}], "p": {"n": "Toby Mao", "y": "2025"}, "u": ""}, {"t": "California Racial Justice Act Research Collaborative", "c": "NGO/ Nonprofit, Social Impact, and Advocacy", "s": "A social science research collaborative supporting advocacy under the California Racial Justice Act (Cal. Penal § 745) through student-led, evidence-based resources.", "d": "The California Racial Justice Act Research Collaborative (CRJARC) produces research-backed resources to support advocacy efforts under the California Racial Justice Act (Cal. Penal § 745).  The student-led collaborative promotes access to justice by developing free, evidence-based materials grounded in peer-reviewed social science research for defendants who have experienced discrimination on the basis of race, ethnicity, or national origin in the California criminal legal system.", "k": ["social science", "legal advocacy", "law", "linguistics", "sociology"], "e": "2025", "n": "I'd love to involve law students and graduate students with a background in social science!", "f": [{"n": "Tilly Brooks", "y": "2024"}], "p": {"n": "Tilly Brooks", "y": "2024"}, "u": "https://profiles.stanford.edu/tilden-brooks"}, {"t": "Cards 4 Kids", "c": "Healthcare and Life Sciences", "s": "Fostering genuine connections, creating moments of joy, and building a supportive community for hospitalized children through interactive, fun, and accessible sports-inspired activities.", "d": "Cards 4 Kids is an initiative dedicated to fostering genuine connections, creating moments of joy, and building a supportive community for hospitalized children through interactive, fun, and accessible sports-inspired activities. Through trading card packs and university chapters whose student volunteers visit and play with patients, we aim to help kids feel like kids, not patients. This year, we hope to grow our reach by building relationships with sports teams, card companies, and collectors, and by exploring new chapters and hospital partnerships nationally and internationally.", "k": ["pediatric health", "hospitalized children", "sports", "trading cards", "global health"], "e": "2026", "n": "We welcome scholars from any class year and discipline who love sports or want to support hospitalized children. We would love help with finance, marketing and PR, partnerships and outreach, operations, web design, and connections to hospitals or universities in the United States and abroad. Athletes and sports fans are especially welcome, as are mentors with experience in pediatrics, child life, nonprofits, or the sports industry.", "f": [{"n": "Shay Nair Sharma", "y": "2026"}], "p": {"n": "Shay Nair Sharma", "y": "2026"}, "u": ""}, {"t": "Clean Closet: Explorations in Affordable, Non-Toxic, Sustainable Fashion", "c": "Sustainability, Energy and Environmental Science", "s": "Building a path to quality, non-toxic, sustainable clothing that regular people can afford, starting with mapping the technology, players, and existing demand.", "d": "Clothing is a daily decision and powerful tool of expression. Conventional clothing, however, relies on plastics and chemicals that harm workers, wearers, and our environment. Sustainable fashion, on the other hand, is typically expensive, exclusive, and greenwashed.  This project seeks to map existing sustainable textile innovations and supply chains, test demand among everyday consumers, identify the highest-impact entry points, and explore prototypes/business models to address the gaps.", "k": ["sustainable fashion", "textiles", "supply chain", "non-toxic materials", "affordability"], "e": "2026", "n": "Materials science or textile engineering, supply chain/operations, consumer research or marketing, retail/fashion, and design/pattern-making. Also seeking mentors with fashion or sustainable-apparel brand experience.", "f": [{"n": "Cecilia Reis", "y": "2026"}], "p": {"n": "Cecilia Reis", "y": "2026"}, "u": ""}, {"t": "CoLearn: Continually Learning Robots for Creative Education", "c": "Science, Technology and Engineering", "s": "Developing continuously learning robots for creative education that adapt to individual learners over time through long-term co-creation, natural-language feedback, demonstrations, and evolving preferences.", "d": "We aim to explore how robots can support learning through long-term creative collaboration. Rather than acting as static tools that respond to one instruction at a time, the robots would learn how individual students create, explore, and solve problems across repeated interactions. The project will investigate how a robot can continuously adapt to a learner’s interests, skill level, creative style, and preferred level of guidance while collaborating on open-ended making activities such as drawing, building, designing, or other hands-on creative tasks.\n\nOur broader goal is to understand whether continuously adapting robots can become effective educational partners, encouraging experimentation, offering appropriately timed suggestions, and supporting different ways of learning without taking control of the creative process.", "k": ["robotics", "artificial intelligence", "education", "creativity", "human-robot collaboration"], "e": "2026", "n": "We would especially welcome teammates interested in education, learning sciences, design, creative technologies, or art.\n\nRobotics experience is not required. Expertise in education is particularly valuable because a central goal of the project is to understand what meaningful adaptation should look like from a learning perspective, not only from a technical one.", "f": [{"n": "Sunshine Jiang", "y": "2026"}, {"n": "Yingke Wang", "y": "2026"}], "p": {"n": "Yingke Wang", "y": "2026"}, "u": ""}, {"t": "D.Sole Foundation: Diabetic Footcare for Underserved Communities", "c": "NGO/ Nonprofit, Social Impact, and Advocacy", "s": "A nonprofit initiative providing diabetes education and diabetic foot care solutions to low-income communities, conducting research and developing accessible interventions to prevent foot deformities, ulcers, and amputations.", "d": "This nonprofit organization addresses the diabetic foot care crisis in underserved, low-income communities where amputations are disproportionately high. We conduct research into accessible foot care solutions, give policy advice on diabetic foot care, provide community-based diabetes education, and develop interventions for preventing foot deformities and ulcers. Our mission is to bridge the healthcare gap by creating sustainable, affordable solutions that prevent life-altering amputations and improve the quality of life for vulnerable diabetic populations.", "k": ["diabetes", "foot care", "health equity", "amputation prevention", "underserved communities"], "e": "2025", "n": "Seeking team members passionate about health equity with backgrounds in: healthcare/public health for program development, research experience for diabetic foot care studies, nonprofit management, community outreach coordinators for building partnerships with low-income communities, and connections to Stanford Medicine or public health programs.", "f": [{"n": "Saisri Akondi", "y": "2025"}], "p": {"n": "Saisri Akondi", "y": "2025"}, "u": ""}, {"t": "Deep Cuts", "c": "Science, Technology and Engineering", "s": "Building a surgical dataset with Stanford clinicians and engineers to support AI-powered education and future decision support for high-impact procedures in resource-limited settings.", "d": "We aim to build a surgical dataset that links operative video with expert explanations of key decisions, case context, and patient outcomes. Building on Stanford’s existing recording infrastructure and surgical AI work, we will start with one procedure selected with clinicians serving resource-limited communities and develop an initial educational application.", "k": ["Surgical AI", "Surgical Education", "Global Health", "Clinical Decision Support"], "e": "2026", "n": "We welcome teammates with experience in ML, CV, software or data engineering, surgical education, global health, and user-centered design, etc.", "f": [{"n": "Ayden Case", "y": "2026"}], "p": {"n": "Veer Sangha", "y": "2026"}, "u": ""}, {"t": "Despegar Fellows", "c": "Education and Academia", "s": "Despegar Fellows is a remote fellowship for first-generation, low-income STEM university students in Latin America, combining academic mentorship and research-pathway preparation with critical perspectives on higher education and socioemotional learning.", "d": "Founded in 2023, Despegar Fellows is a remote fellowship for first-generation, low-income STEM university students in Latin America. Fellows explore research opportunities and postgraduate pathways through weekly individual mentorship and guided learning materials, while four Critical Perspectives on Higher Education workshops examine how socioeconomic background, geography, migration, gender, and institutional structures shape academic trajectories. The program will also incorporate voluntary group sessions on socioemotional learning and student well-being, introducing practical skills and helping fellows identify resources and networks of care.", "k": ["first-generation low-income students", "STEM research access", "academic mentorship", "socioemotional learning", "Latin America"], "e": "2025", "n": "Our highest priorities are communications and fundraising for Despegar Fellows as a nonprofit initiative. We are seeking people with experience in marketing, social media strategy, outreach, and public communications, alongside grant writing, donor development, and fundraising for small nonprofit organizations. These are the areas where our team currently needs the most support.\n\nOur next priority is recruiting volunteer mentors for the fellowship cycle tentatively planned for June 2027. We welcome STEM researchers, graduate students, and professionals who could offer approximately one hour of individual mentorship per week over 12 weeks. Spanish proficiency would be particularly useful. We also welcome mentors who speak English, Portuguese, or French, depending on fellows' language needs. We would also value support with volunteer coordination.", "f": [{"n": "Thalia Marycielo Leyton Reto", "y": "2025"}], "p": {"n": "Thalia Marycielo Leyton Reto", "y": "2025"}, "u": ""}, {"t": "Dialekt", "c": "NGO/ Nonprofit, Social Impact, and Advocacy", "s": "Overcoming immigrant occupational mismatch through free personal and group tutoring.", "d": "Dialekt is a nonprofit organization dedicated to helping adult immigrants achieve their professional goals. We provide free personalized support through individual and group sessions, covering topics like ESL, GED, the U.S. citizenship exam, tech literacy, professional development (resume building, interview prep, etc.) and more. Through our Stanford branch, over 50 volunteers have had the opportunity to form long-term relationships with over 30 people from across the world, expanding their worldview while making a distinct positive impact with every session.", "k": ["immigration", "education", "professional development"], "e": "2025", "n": "We are seeking volunteers with a passion for immigrant education and a desire to build long-term, meaningful relationships with our clients. We are also seeking leadership support to expand our services to other areas in the Bay and to establish additional chapters across the country. \n\n**Volunteers do NOT need previous teaching experience or specific knowledge of the U.S. citizenship exam or GED exam! All required training is provided by Dialekt. Volunteers also do NOT need to speak languages other than English (though this is an excellent plus!).**", "f": [{"n": "Sophia Pribus", "y": "2025"}], "p": {"n": "Sophia Pribus", "y": "2025"}, "u": ""}, {"t": "EconStats.org", "c": "Government, Law, and Public Policy", "s": "We are making economic data accessible to all -- expanding access to the benefits of a critical public good.", "d": "EconStats.org is an economic data tool that combines economic and methodological context and a novel citation tool to allow users to get reliable data-backed answers (with consistent charts and figures) to economic data questions. Our basic thesis is that government economic data is an under-utilized public good that’s out of reach to too many people.", "k": ["Data", "Econ", "Statistics"], "e": "2025", "n": "Looking for technical collaborators and anyone interested in this project", "f": [{"n": "Josh Waldman", "y": "2024"}], "p": {"n": "Josh Waldman", "y": "2024"}, "u": ""}, {"t": "Empowering Futures: Improving Reproductive and Neonatal Health", "c": "Healthcare and Life Sciences", "s": "A collaborative of scholars working to identify interventions to improve health outcomes in maternal, reproductive, and neonatal health – starting with analysis and interventions at Lucile Packard Children’s Hospital and then scaling to local and international communities.", "d": "We are hoping to build a learning community that can share insights and ideas while identifying projects in maternal, reproductive, and neonatal health to drive better health outcomes for parents and children – ideally this will include gathering data and testing initiatives at Lucile Packard Children’s Hospital, publishing our findings, and sharing outside of the Stanford community. Everyone is welcome to join and pitch new outcomes or interventions to investigate! \nSome current projects we are working on include (1) increasing lactation service access for families that have a primary language other than English and (2) improving patient flow and staffing for the NICU and intermediate care nursery. We are ideating about others, including: (3) identifying the impact of early/delayed inductions on maternal and infant outcomes and (4) capturing the potential impact of reduced mifepristone access.", "k": ["Maternal and child health", "health access", "reproductive care"], "e": "2025", "n": "We invite anyone working on maternal, child, or reproductive health or with interest and skills in data analysis, machine learning, interviewing, and community engaged research to join our group. We also are launching a project focused on hospital access among individuals that have a primary language other than English, so please bring your language skills. Truly all skills are valuable!", "f": [{"n": "Eliza Ennis", "y": "2022"}], "p": {"n": "Eliza Ennis", "y": "2022"}, "u": ""}, {"t": "epidemiKH", "c": "Healthcare and Life Sciences", "s": "We develop cutting-edge infectious disease response tools and work with public health authorities to implement them.", "d": "The epidemiKH project seeks to modernize infectious disease response by (1) engineering new computational methods to understand pathogen spread and evolution, and (2) collaborating with local, national, and international public health authorities to implement them. To date, we have developed or are in the process of developing technologies for tracking host-to-host disease transmission and predicting future variants, which have gained attention from public health authorities in California and other Western states. As the project enters its second year, we will continue to build out these tools and launch new ones, as well as work directly with stakeholders to apply them towards epidemic response in real time.", "k": ["pandemics", "public health", "technology", "health policy"], "e": "2024", "n": "Combination of engineers, bioinformaticians, and health policy experts", "f": [{"n": "Ivan Specht", "y": "2024"}], "p": {"n": "Ivan Specht", "y": "2024"}, "u": "https://profiles.stanford.edu/ivan-specht"}, {"t": "Equal Depths", "c": "NGO/ Nonprofit, Social Impact, and Advocacy", "s": "Equal Depths expands access to water safety education and life-saving swim lessons for underserved communities where pool access is lowest.", "d": "Drowning is a leading cause of unintentional death for children, and the risk falls hardest on communities with the least access to pools, lessons, and safety training. Equal Depth will partner with local organizations in the Bay Area to bring water safety and life-saving skills to families who have been left out.", "k": ["water-safety", "community health", "health equity", "child safety"], "e": "2026", "n": "I'm looking for anyone with community organizing, grant writing, or social outreach skills. Mentors who have built community health or youth programs, especially with limited resources, would be especially helpful.I'd also love fellow swim instructors to help teach lessons (no need to be an expert!)", "f": [{"n": "Paige Madden", "y": "2026"}], "p": {"n": "Paige Madden", "y": "2026"}, "u": ""}, {"t": "Evaluating prior authorization", "c": "Healthcare and Life Sciences", "s": "Evaluating the impact of prior authorization requirements set by US health insurers", "d": "This initiative evaluates how prior authorization requirements imposed by US health insurers affect access to care, quality, and costs, using a measurement framework that can be updated as insurer strategies change. We also aim to share our findings in ways that engage patients and other affected communities.", "k": ["health policy", "health insurance", "prior authorization", "healthcare access", "health systems"], "e": "2026", "n": "I think a diverse range of skillsets and perspectives will be instrumental for supporting this project. Whether it’s students already involved in healthcare or those coming from other backgrounds, the only necessary throughline is an interest in learning about and improving healthcare access", "f": [{"n": "Dan Zhu", "y": "2026"}], "p": {"n": "Dan Zhu", "y": "2026"}, "u": ""}, {"t": "Every Phase: Supporting Mothers Through Change", "c": "Healthcare and Life Sciences", "s": "Addressing gaps in women’s health information and support so women can better understand their changing bodies, have their concerns heard, and connect with care, beginning with maternal health in Ethiopia.", "d": "Every Phase seeks to bring women’s often unseen health struggles into the light, addressing the uncertainty, physical pain, and emotional distress that can accompany changes in their bodies, especially when those changes are poorly understood and experienced alone. Beginning with pregnancy and life after childbirth in Ethiopia, we aim to work with mothers and local health professionals to develop accessible, culturally relevant information and strengthen connections to care and community support as women’s needs evolve. Our goal is for women to better understand their bodies, have their concerns heard, and find trusted support for their own health and their babies’ well-being, without having to navigate these changes alone in the dark.", "k": ["women’s health", "maternal and newborn health", "Ethiopia", "health literacy", "global health"], "e": "2026", "n": "I bring engineering experience, experience in Ethiopia, and Amharic language skills. I would love to collaborate with medical students interested in or familiar with women’s health, maternal health, newborn health, or pediatrics, alongside clinical mentors who can guide health content. Engineers and computer scientists would help design and build the application together, while teammates with experience in public health, user experience design, community engagement, or evaluation would strengthen its development. Above all, I welcome anyone who cares about improving women’s and children’s health and wants to contribute their perspective, creativity, and willingness to learn.", "f": [{"n": "Feven Naba", "y": "2024"}], "p": {"n": "Feven Naba", "y": "2024"}, "u": ""}, {"t": "Exploring Vaccine Hesitancy in the Perinatal Period", "c": "NGO/ Nonprofit, Social Impact, and Advocacy", "s": "A research and community health initiative to study vaccine hesitancy in pregnancy and pilot trainee-led interventions to address it.", "d": "Through collaborations with LCPH and Stanford’s OBGYN department, we plan to identify the various drivers of perinatal vaccine hesitancy. We also aim to develop stronger curriculum for trainees around vaccine/medication hesitancy to ultimately inform community interventions where trainees can administer vaccine counseling in the clinical setting.", "k": ["pregnancy", "maternal-fetal health", "vaccine hesitancy", "medical education"], "e": "2025", "n": "Since we’re still in the early stages, I’d love to collaborate with anyone interested in public health, community interventions, perinatal health, statistics, or quality improvement.", "f": [{"n": "Isha Sanghvi", "y": "2024"}], "p": {"n": "Isha Sanghvi", "y": "2024"}, "u": "https://profiles.stanford.edu/isha-sanghvi"}, {"t": "Field of View", "c": "Art, Media, and Communications", "s": "An expanding and ever-changing public exhibition series and digital gallery designed to transform KH Scholars' work (which may include algorithmic models, maps, archival documents, and microscopic views) into engaging visual art accessible to a general audience.", "d": "Field of View is an online gallery and public exhibition series that makes KH Scholars’ research visible to people outside their fields. Scholars share an image from their work, like microscopy, a map, or an archival document, with a short caption they write for a general audience. For work with no picture, like a math problem, a model, or an idea, we will work with scholars to turn it into an artistic visualization. Next to each piece, a caption or video will introduce the scientist and the question they are trying to solve.\n\nOver the year, we will build the gallery through showcase evenings and exhibits across Stanford, and leave behind a gallery and a guide that each new KH cohort can keep adding to. We will also invite photographers, science communicators, and others who turn science into art to help scholars prepare their work. In the future, we hope to open the gallery to researchers beyond Knight-Hennessy and host an Art in Science competition.", "k": ["communication", "art", "data visualization", "interdisciplinary", "public engagement"], "e": "2026", "n": "I would love teammates from any background, since the exhibit will be better the more fields it includes! Open to both science and non-science/STEM fields, any research that could be put into images. It would be especially helpful to have people with experience in graphic design or visual art, event planning or curation, web development, photography or printmaking, and marketing. Mostly, I am looking for people who are curious about what research looks like in other fields. No art background needed!", "f": [{"n": "Ashley Yeh", "y": "2024"}], "p": {"n": "Ashley Yeh", "y": "2024"}, "u": "https://profiles.stanford.edu/ashley-yeh"}, {"t": "First Teachers", "c": "Education and Academia", "s": "Helping low-income parents, the first teachers of their children, support development from birth to age five through an AI-powered companion", "d": "250 million young children worldwide are at risk of not reaching their developmental potential, and the most effective solution, coaching parents at home, rarely reaches the poorest families. First Teachers will review what works in early childhood programs, co-design an AI companion with parents, starting in Latin America, and test channels that families already use, such as WhatsApp. Our goal is an open, evidence-based prototype and a model for reaching every family sustainably, which families, programs and governments anywhere can adopt.", "k": ["Early childhood", "Parenting", "Educational equity", "AI for social impact", "Latin America"], "e": "2026", "n": "We would especially value software engineering and AI, design, medicine, pediatrics or psychology, and policy. Lived experience as a parent, or work with families in Latin America and other low- and middle-income regions, would also help. No early childhood expertise is needed, only curiosity and commitment.", "f": [{"n": "Juan Alvarez", "y": "2025"}], "p": {"n": "Juan Alvarez", "y": "2025"}, "u": ""}, {"t": "FliSci’s Family Forward Fund", "c": "NGO/ Nonprofit, Social Impact, and Advocacy", "s": "Establishing a comprehensive loan forgiveness fund to alleviate student and familial debt burdens in higher education, specifically targeting the disproportionate impact of educational debt on First-Generation and/or Low-Income (FLI) individuals.", "d": "Our proposal outlines the establishment of a loan forgiveness fund designed to provide comprehensive debt erasure for both student educational debt and associated family-incurred educational debt. This initiative challenges the atomistic perception of students in financial aid discourse, acknowledging the profound familial entanglement in higher education financing.", "k": ["education", "access", "social impact"], "e": "2025", "n": "In collaboration with FLiSci, an educational nonprofit founded by Knight-Hennessy Scholar Gabriel Reyes that supports First-Generation/Low-Income (FLI) students pursuing science careers, we (Emerson Johnson and I) are initiating the grant writing and philanthropy phase of our project.", "f": [{"n": "Jocelyn Ricard", "y": "2023"}, {"n": "Emerson Johnston", "y": "2023"}], "p": {"n": "Jocelyn Ricard", "y": "2023"}, "u": "https://profiles.stanford.edu/jocelyn-ricard"}, {"t": "Foresee Center", "c": "NGO/ Nonprofit, Social Impact, and Advocacy", "s": "A research group leveraging AI for climate adaptation, environmental conservation, and heritage preservation.", "d": "The Foresee Center, also known as the Center for Climate, Conflict, and Change, is an interdisciplinary research group of engineers and explorers leveraging AI for climate adaptation, environmental conservation, and heritage preservation. We foresee a wave of consequences due to climate change and global conflict, and our mission is to document these impacts through 3D models, storymaps, and empathetic co-design.", "k": ["Journalism", "Climate Change", "Global Conflict", "Experimental Storytelling", "AI"], "e": "2026", "n": "Seeking mentorship in navigating the non-profit space and how to create sustainable, long-term funding. Open to all conversations, interests, and feedback as well!", "f": [{"n": "Ronan Wallace", "y": "2025"}], "p": {"n": "Ronan Wallace", "y": "2025"}, "u": ""}, {"t": "Global Neurosurgery Collaborative", "c": "NGO/ Nonprofit, Social Impact, and Advocacy", "s": "Research and implementation to widen access to neurosurgery in conflict-affected and low-and-middle income countries", "d": "Neurological diseases are the leading cause of disability worldwide, and the burden is disproportionately concentrated in, and rising in, low- and middle-income countries (LMICs) and conflict-affected settings. Neurosurgery is an essential tool for addressing this burden, yet access to neurosurgical care in these same regions remains severely limited. We are beginning in Haiti, where every hospital offering neurosurgical services has closed amid gang violence and civil unrest. There, our goal is to lead research and implement solutions that prioritize durable health-system strengthening over episodic surgical missions, in order to restore and expand access to neurosurgical care.", "k": ["conflict", "neurosurgery", "Haiti", "research"], "e": "2026", "n": "Policy research, qualitative interview/market research, outcome measurements, AI in education, cognitive neuroscience of AI-assisted learning", "f": [{"n": "Hieu Nguyen", "y": "2025"}], "p": {"n": "Hieu Nguyen", "y": "2025"}, "u": "https://profiles.stanford.edu/hoang-minh-hieu-nguyen"}, {"t": "GOAL @ Stanford: Gyn/Ob Advocacy Lab", "c": "Healthcare and Life Sciences", "s": "An interdisciplinary learning collaborative centered on reproductive justice and gynecologic and obstetric health.", "d": "Comprehensive trauma-informed education in gynecologic and obstetric (Gyn/Ob) topics is essential to empower the next generation of health care providers. GOAL (Gyn/Ob Advocacy Lab) at Stanford strives to partner with medical school and residency program educators to offer comprehensive learning resources across the gynecologic/ obstetric care spectrum. Our group aims to center teachings in reproductive justice by incorporating patient lived experiences, evidence-based science, and community health partnerships.", "k": ["reproductive health", "Gyn/Ob", "community health", "medical advocacy", "justice"], "e": "2026", "n": "I am open to all Scholars interested in maternal and child health, Gyn/Ob, reproductive justice, public health, and health education! This effort will require a passionate group of Scholars across disciplines, so please reach out if these topics interest you -- particularly would love collaborators in medicine, public health, law, and education.", "f": [{"n": "Siwaar Abouhala", "y": "2025"}], "p": {"n": "Siwaar Abouhala", "y": "2025"}, "u": "https://profiles.stanford.edu/siwaar-abouhala"}, {"t": "Hardening Critical Infrastructure: Lessons from Ukraine", "c": "Science, Technology and Engineering", "s": "Engineering practical ways to protect energy and water infrastructure from drone and missile attacks, starting with Ukraine and applying the lessons globally.", "d": "Ukraine's power and water systems have become frontline targets, with drone strikes repeatedly leaving millions without electricity, heat, and water. This project intends to bring together engineers and policy experts to develop and test practical solutions for hardening critical infrastructure: physical protection, counter-UAS detection, and designs that make systems faster to repair. Our goal is to deliver proposals that Ukrainian operators can pilot, and lessons that apply to any country whose infrastructure faces deliberate attack.", "k": ["critical infrastructure", "counter-UAS", "energy security", "Ukraine"], "e": "2026", "n": "Most needed: electrical, mechanical, or aerospace engineering; drone, sensor, and radar technology; and energy/water systems. Also welcome: security policy, international law, and finance for structuring pilots.", "f": [{"n": "Roman Shemakov", "y": "2026"}], "p": {"n": "Roman Shemakov", "y": "2026"}, "u": ""}, {"t": "Ideas That Travel", "c": "Art, Media, and Communications", "s": "A media initiative exploring how serious ideas and consequential conversations can be packaged in engaging, culturally relevant formats that reach audiences far beyond traditional academic and policy circles.", "d": "Ideas That Travel is an experiment in making important conversations more accessible, engaging, and shareable. We will bring together folks with diverse expertise and life experiences for candid, informal conversations about consequential topics, then experiment with video, audio, short-form clips, and other formats designed for how people consume media today. The goal is to identify a repeatable model for helping substantive ideas reach large audiences without losing the nuance that makes those ideas valuable.", "k": ["media", "public discourse", "storytelling", "digital content", "social media"], "e": "2026", "n": "We would love a multidisciplinary team. Useful skills include video production and editing, social media and audience growth, graphic or visual design, journalism or storytelling, and branding. Just as importantly, we are looking for scholars from a wide range of disciplines who are curious, opinionated, comfortable having candid conversations, and excited about translating complex ideas for broad audiences. No specific media experience is required.", "f": [{"n": "Armin Rezaiean-Asel", "y": "2024"}], "p": {"n": "Armin Rezaiean-Asel", "y": "2024"}, "u": ""}, {"t": "Improving Birth Outcomes through Multiomic and Vaginal Microbiome Profiling", "c": "Healthcare and Life Sciences", "s": "Improving maternal-infant health outcomes in low- and middle-income countries based on multi-omic and vaginal microbiome profiling", "d": "The goal is to provided a biomedical and data-driven basis on which we can use to predict birth outcomes based on the mother's biomedical data in low- and middle-income countries.", "k": ["data science", "maternal health", "bioinformatics"], "e": "2026", "n": "No new members needed now, only seeking mentors.", "f": [{"n": "Debbie Ho", "y": "2024"}], "p": {"n": "Debbie Ho", "y": "2024"}, "u": "https://profiles.stanford.edu/debbie-ho"}, {"t": "Infrastructure for Her: Advancing Gender-Responsive Mobility in Monterrey, Mexico", "c": "Government, Law, and Public Policy", "s": "A gender-responsive mobility lab measuring \"the invisible fare\" women pay to move through Monterrey, Mexico (in time, money, care, safety and opportunity), and turning that evidence into practical, fundable transportation policies that expand women's economic participation.", "d": "Infrastructure for Her is a policy lab that treats women’s mobility as economic infrastructure, recognizing that the true cost of getting around extends far beyond the price of a ticket. Starting in Monterrey, Mexico, the initiative will measure this “invisible fare” for low-income women, including time, money, care-related travel, safety risks, and lost economic opportunities, and translate that evidence into a costed, legally grounded policy and financing roadmap for state and municipal decision-makers. This pilot is the foundation for a Nuevo León think-and-do tank on gender-responsive infrastructure towards the expansion of women’s economic participation.", "k": ["women’s economic participation", "mobility", "urban infrastructure", "gender-responsive policy", "Mexico"], "e": "2026", "n": "I'm looking for teammates to own one of four workstreams. You don't need to be a mobility expert to join:\n- **Data and measurement:** statistics, survey design, GIS mapping, or qualitative and community-based research\n- **Law and policy:** public policy, government implementation, or gender and care policy\n- **Finance and costing:** economics, cost-benefit analysis, or infrastructure and public-sector finance\n- **Design and storytelling:** data visualization, design, or communications\n\nUrban planning or transportation engineering expertise would strengthen every workstream, and Spanish is helpful but not required.\n\nI bring a Mexico-specific legal and policy perspective, experience working with public and private stakeholders, and a background in infrastructure and project finance. I'm especially looking for teammates with technical mobility and data skills to complement that.\n\nI'd also welcome mentors with experience in transportation policy, urban economics, gender and development, or building nonprofits in Latin America.", "f": [{"n": "Regina María de Lira Molina", "y": "2026"}], "p": {"n": "Regina María de Lira Molina", "y": "2026"}, "u": ""}, {"t": "Intelligence KHollective", "c": "Government, Law, and Public Policy", "s": "Exploring how emerging AI technologies may shape future societies, and developing ethical frameworks for governance in the age of algorithmic influence", "d": "Our project explores how AI technologies designed to influence people’s opinions and behavior might impact the future of our society. We study both the risks and possibilities of using AI for social influence and how these systems can be governed responsibly.  Working across disciplines, we aim to publish research and share ideas on how humanity can govern these technologies ethically to foster a flourishing global society.", "k": ["Artificial Intelligence", "Social Simulations", "AI Safety"], "e": "2025", "n": "We welcome engineers to contribute to the experimental components of our research, as well as scholars from law, philosophy, policy, mathematics, and the sciences to contribute our interdisciplinary approach.\n\nWe also invite participants from diverse cultural backgrounds, whose perspectives are essential to ensuring our research reflects global perspectives.\n\nOur team is well equipped to produce cutting-edge research papers and public-facing blog posts that push the frontier of this conversation.", "f": [{"n": "Aneesh Pappu", "y": "2025"}, {"n": "Batu El", "y": "2024"}], "p": {"n": "Batu El", "y": "2024"}, "u": "https://profiles.stanford.edu/batu-el"}, {"t": "Intersex Community Health Coalition", "c": "Healthcare and Life Sciences", "s": "Addressing gaps in intersex/variation in sex characteristics health education, access, and community engagement", "d": "This is a coalition of community members, health activists, public health professionals medical providers/trainees, and other allies who are passionate about improving the state of intersex/variations in sex characteristics health both in the United States and abroad. We will develop a wide range of services for both intersex community members, families of intersex individuals, and non-intersex healthcare/medical professionals, including health education sessions/materials and research led by and for intersex people. We will also act as a coalition for facilitating communication between other intersex health and diagnosis specific organizations to improve collaboration in this space.", "k": ["Community health", "health advocacy", "non-profit deveopment", "community-building"], "e": "2026", "n": "We are primarily seeking mentors in non-profit establishment, PR, developing sustainable systems in community health/activist work.\n\nHowever, if you are a member of the community or an ally with non-profit establishment/development expertise we are excited to chat!", "f": [{"n": "Meg Quint", "y": "2025"}], "p": {"n": "Meg Quint", "y": "2025"}, "u": "https://profiles.stanford.edu/meg-quint"}, {"t": "KHnowledge & Policy", "c": "Government, Law, and Public Policy", "s": "An interdisciplinary project connecting domain experts with foreign and domestic policy practitioners to explore how specialized knowledge in fields such as the natural sciences, economics, and mathematics can better inform policymaking and public decision making.", "d": "KHnowledge & Policy would bring together domain experts and policy practitioners to examine how specialized knowledge can better inform public decision making. Through scholar led briefings, practitioner conversations, institutional visits, and public facing writing, the project would explore both how experts can better understand policy institutions and how policymakers can better recognize, access, and use technical expertise.", "k": ["foreign policy", "public policy", "interdisciplinary expertise", "science and technology policy", "knowledge translation"], "e": "2026", "n": "This is intentionally very open ended. I would love a team with as wide a range of backgrounds as possible, including people from technical fields, policy, law, journalism, the humanities, and beyond. More than any particular skillset, I am looking for people who are curious about how expertise and policy interact and who would be excited to help shape the project as it develops.", "f": [{"n": "Naseeb Andar", "y": "2026"}], "p": {"n": "Naseeb Andar", "y": "2026"}, "u": ""}, {"t": "Know Your Water", "c": "Government, Law, and Public Policy", "s": "Develop a publicly-available tool that translates California's fragmented water governance into plain-language answers, letting any household look up who runs their water, whether it's safe, and what they can do about it.", "d": "California was the first state to recognize a human right to water, yet most households have no practical way to learn how their water is governed, whether it's safe, or how to act on a concern. ‘Know Your Water’ will map the stack of institutions sitting above California households by turning disparate public data into a single, plain-language lookup tool. Our goal is a working prototype covering a pilot set of counties with future goals to scale statewide.", "k": ["Water security", "public data", "environmental justice", "water governance", "data literacy"], "e": "2026", "n": "We're a two-person team and welcome collaborators with any (1) web development, (2) geospatial, or (3) plain-language public tools experience. We would also value team members interested in California water law/policy, environmental justice and management, utility regulation, and community engagement.", "f": [{"n": "Josh Heupel", "y": "2025"}, {"n": "Greta Markey", "y": "2024"}], "p": {"n": "Greta Markey", "y": "2024"}, "u": ""}, {"t": "Learn to Discern: Building Educational Tools to Teach Digitial Literacy Skills in the Age of AI", "c": "NGO/ Nonprofit, Social Impact, and Advocacy", "s": "Developing games to teach children transferrable digital literacy skills.", "d": "We hope to bring together a multidisciplinary team to build games and other fun educational tools to help teach children digital literacy skills in the age of AI. Children today—for the first time ever—are exposed to entirely fabricated media that looks authentic. It is evermore important that they learn at a young age to be critical consumers of information, and we hope to make it fun!", "k": ["education", "artificial intelligence", "digital literacy"], "e": "2026", "n": "We are in early ideation phase! We'd love as diverse of a range of backgrounds as possible. We'd especially like the help of people with coding experience, ethics, technology policy, and education.", "f": [{"n": "Karla Perez", "y": "2025"}, {"n": "Ayodele Theard-Lewis", "y": "2025"}, {"n": "Chloe Nguyen", "y": "2025"}], "p": {"n": "Chloe Nguyen", "y": "2025"}, "u": ""}, {"t": "Life and Career Design for High School Students", "c": "Education and Academia", "s": "A design thinking program that empowers high school students to discover career paths through self-reflection and hands-on exploration, moving beyond simplistic career matching tests to uncover who they truly are and what they want to contribute to the world.", "d": "This program helps high school students answer the infamous \"what do you want to be when you grow up\" question by giving students structured time and tools to explore their values, interests, and aspirations before making life decisions like attending college or selecting a major. Using the Stanford Life Design Lab's design thinking methodology, workshops will be adapted for high school students for the first time ever to allow students engage in empathy work (understanding themselves), ideation (exploring possibilities), and prototyping (testing career interests through real-world experiences). The result is a generation of young adults who enter college and careers with genuine self-awareness and intentional direction, rather than defaulting to paths that leave them unfulfilled years later.", "k": ["Self-discovery", "Design thinking", "Career exploration", "Life Design"], "e": "2025", "n": "I'm looking for additional members to form a facilitation team. Ideally, team members have facilitation experience and enjoy working with students, but all are welcome to join. We'll put together a facilitation training prior to going into schools where everyone will get to practice working with the material.", "f": [{"n": "Dara Drake", "y": "2025"}], "p": {"n": "Dara Drake", "y": "2025"}, "u": "https://profiles.stanford.edu/dara-drake"}, {"t": "Local AI Lab", "c": "Science, Technology and Engineering", "s": "A student lab building free, private AI tools and agents that run entirely on affordable local hardware, so people and communities priced out of commercial AI can use it on their own terms.", "d": "Powerful AI is increasingly locked behind monthly subscriptions, costly cloud accounts, and reliable internet, leaving low-income students, small nonprofits, and under-resourced communities either priced out or forced to hand over their sensitive data to a few large companies. Local AI Lab brings scholars together to build free, open-source AI systems and agents that run on hardware people already own or can share. These tools work offline, cost nothing per use, and keep data in the user's hands, and we'll turn our findings into guides and workshops so communities can set up and run local AI themselves.", "k": ["AI access", "open-source AI", "digital equity", "privacy", "education"], "e": "2026", "n": "We need technical members in CS, engineering, or ML to build and optimize the stack, but non-technical skills matter just as much: community and nonprofit experience to build partnerships towards democratizing AI; business and market research to help us conduct interviews to understand real needs faced by these small organizations in using AI; design and UX to make the tools usable by non-experts; education to shape educational guides; law, policy, or ethics to guide data privacy and responsible use; languages beyond English to test multilingual use; program evaluation to measure whether the tools actually help. No AI experience is required. Curiosity and a willingness to build are enough.", "f": [{"n": "Shivam Kalkar", "y": "2025"}, {"n": "Anvita Gupta", "y": "2025"}], "p": {"n": "Anvita Gupta", "y": "2025"}, "u": "https://profiles.stanford.edu/anvita-gupta"}, {"t": "MedBridge: Building Physician–Scientists in the Americas", "c": "NGO/ Nonprofit, Social Impact, and Advocacy", "s": "Connecting Stanford graduate and medical students with Latin American medical students to build a cross-border mentorship network in research and academic development.", "d": "Many Latin American medical students lack access to research mentors, limiting their development as clinician–scientists. MedBridge connects them with Stanford graduate students — including MDs, PhDs, and master’s students — who have research experience and can offer guidance through the U.S. postgraduate mentorship model. The project aims to pilot a structured mentorship program, provide training resources, and develop a scalable framework to strengthen regional research capacity.", "k": ["mentorship", "medical education", "Latin America", "research", "global health"], "e": "2025", "n": "I’m seeking team members with experience in biomedical research (any type), global health, education design, or cross-cultural program development. Mentors with research experience — particularly graduate students in MD, PhD, or master’s programs — are especially encouraged to join. Diverse perspectives from scholars interested in Latin America and academic mentorship are welcome.", "f": [{"n": "William Rojas Carabali", "y": "2025"}], "p": {"n": "William Rojas Carabali", "y": "2025"}, "u": "https://profiles.stanford.edu/william-rojas-carabali"}, {"t": "Mentorship in Academia Project", "c": "Education and Academia", "s": "To build an academia-specific framework for improving mentoring relationships, we are studying how some mentors multiply and support their mentees while others unintentionally diminish those around them.", "d": "Most people in academia want to have a positive, multiplying effect on those they mentor, yet many people report negative experiences with mentors or advisors. Inspired by Liz Wiseman’s book Multipliers, we will survey and interview people across academia to explore how actions in mentoring relationships can either multiply or diminish mentees’ capabilities. We will develop an academia-specific Multipliers/Diminishers framework and identify concepts like Accidental Diminishers (well-intentioned mentors who unknowingly diminish their mentees) that could highlight areas of improvement in mentoring relationships.", "k": ["mentorship", "academia", "graduate students", "multipliers"], "e": "2026", "n": "Everyone is welcome! I’m hoping to interview/survey people across different disciplines, so I would love to have team members from a diverse range of disciplines to get varied perspectives. I would particularly appreciate help on designing interview/survey questions, research logistics (e.g., IRB approval, finding participants), and analyzing interview/survey results.", "f": [{"n": "Tyler Colenbrander", "y": "2024"}], "p": {"n": "Tyler Colenbrander", "y": "2024"}, "u": ""}, {"t": "Mind Matters: Empowering Teachers for Youth Mental", "c": "Education and Academia", "s": "To build emotionally supportive, stigma-free learning environments by empowering teachers in LMICs with practical, culturally grounded tools to support student mental health.", "d": "Schools are often the first, and sometimes only, social spaces where children’s emotional well-being can be noticed and nurtured. Yet in many low- and middle-income countries (LMICs), teachers receive little or no training in mental health literacy, stigma reduction, or equitable classroom support. Many educators unintentionally reinforce harmful stereotypes around gender, mental illness, or “success,” which can deeply affect students’ self-esteem and help-seeking behaviors. By equipping teachers with culturally adapted mental health literacy tools, this project aims to foster empathy, emotional awareness, and stigma-free school cultures.", "k": ["mental health", "teacher empowerment", "youth well-being"], "e": "2025", "n": "We will likely need an interdisciplinary team that includes a psychology student to guide mental health literacy and intervention design, an education student to integrate well-being practices into curricula and teacher training, and media or design students to create engaging educational videos and learning tools. Overall, anyone interested in education or healthcare is welcome to join.", "f": [{"n": "Assel Ibadulla", "y": "2025"}], "p": {"n": "Assel Ibadulla", "y": "2025"}, "u": "https://profiles.stanford.edu/assel-ibadulla"}, {"t": "Neurodiversity Network", "c": "NGO/ Nonprofit, Social Impact, and Advocacy", "s": "Addressing the resource and services gap for neurodivergent individuals in the transition from secondary education to adulthood.", "d": "The initiative is informed by advocates and individuals with lived neurodivergent experience to provide concrete resources, support, networking, and physical guides that advise individuals aging out of secondary education and entering a stage of adulthood where support is minimal. The network is intended to be a life-long free resource for neurodivergent individuals to pair with mentors who are in a field that the mentee is passionate or curious about. This community will strive to eliminate the services gap that neurodivergent individuals frequently experience.", "k": ["mentorship", "community-building", "neurodiversity", "support", "nurture"], "e": "2026", "n": "I would love support in any of the following areas:\n- Website/platform design\n- Expertise in making accessible resources (ideally individuals in education and those who come from untraditional fields) ie handouts/cheatsheets for how to get into industries like academia, industry, blue collar etc.\n- Mentors for neurodivergent individuals (can have experience or no experience)\n- Those who have worked on other mentorship projects and want to become mentors\n- Those who want to \"mentor the mentor\" and help people cultivate their mentorship skills\n- **Idea-makers:** people who want to come up with ideas for support\n- **People with lived experience or advocacy:** those who are neurodivergent who can help inform this work or who have a personal connection to this project and want to use their experience to guide this work\n- Social media/marketing/PR\n- Diverse backgrounds! Anyone is welcome!", "f": [{"n": "Sammie Harker", "y": "2026"}], "p": {"n": "Sammie Harker", "y": "2026"}, "u": ""}, {"t": "Next Play", "c": "Science, Technology and Engineering", "s": "Next Play: Adjacent-Career Pathways for Athletes and Performers in Underserved Communities", "d": "Students' passions are often their strongest motivation, but many only see one narrow way to turn them into a living, like a professional contract or a record deal, or no way at all. Next Play pairs students with Stanford mentors who help them map the careers around their passion. Over a year, mentors and students write a pivot plan together, build real projects every week, go behind the scenes with professionals each month, and finish with a portfolio and a reference letter. That way, if a student's first goal doesn't work out, they already have a meaningful path that keeps what they love.", "k": ["education", "community-building", "pivoting", "career"], "e": "2026", "n": "I'd love to seek out KH students as mentors and would love a diverse range of students who've worked across multiple industries/openly explored diverse interests. I'd also love team members who've worked with leaders across Bay Area public schools/connected across other industries.", "f": [{"n": "Vivian Utti", "y": "2026"}], "p": {"n": "Vivian Utti", "y": "2026"}, "u": "https://profiles.stanford.edu/vivian-utti"}, {"t": "Nonvisual Communication for Accessibility", "c": "Science, Technology and Engineering", "s": "Learning and creating best practices in nonvisual communication", "d": "While we often think we primarily use sight to experience the world, our other senses—like hearing and touch—play crucial roles in how we interact and communicate. Nonvisual mediums are strong communication tools that harness these senses. \n\nThis project will explore best practices in nonvisual communication by visiting tactile exhibitions, interviewing experts, and creating our own nonvisual media like immersive art and virtual reality. In doing so, we may also start the discussion on how to make the Knight-Hennessy community more inclusive for current and future blind and low-vision scholars.", "k": ["accessibility", "communication", "education"], "e": "2024", "n": "Anyone welcome, people interested in education and accessibility", "f": [{"n": "Saehui Hwang", "y": "2022"}], "p": {"n": "Saehui Hwang", "y": "2022"}, "u": ""}, {"t": "Off Model Podcast", "c": "Art, Media, and Communications", "s": "Moving past pure technical benchmarks, the show examines what society's transition into an AI-driven era means through conversations with prominent thinkers, researchers, and leaders.", "d": "a debate show that challenges speakers to argue their opponents' views before presenting their own. This format aims to foster empathy, critical thinking, and deeper understanding of complex issues. By tracking audience opinion shifts throughout the process, the show demonstrates how exposure to diverse perspectives can influence public sentiment on controversial topics.", "k": ["podcast", "AI", "society", "technology"], "e": "2024", "n": "TV production (including director, camera operators, editors, and sound engineers), content creation (researchers and writers), technology (developers for the voting system), talent management, marketing and PR, legal counsel, audience engagement, graphic design, and an executive producer to oversee the project and get debaters invited, interviewed and ready to debate!", "f": [{"n": "Thay Graciano", "y": "2023"}], "p": {"n": "Thay Graciano", "y": "2023"}, "u": "https://profiles.stanford.edu/ThayGraciano"}, {"t": "Ojos del Mar", "c": "NGO/ Nonprofit, Social Impact, and Advocacy", "s": "Ojos del mar is a citizen science platform that engages Costa Rican communities in co-analyzing imagery with marine science researchers to train machine learning models and promote public participation in ocean science.", "d": "Video footage from animal-borne cameras offers a powerful window into the underwater world, yet much of it remains unseen by the public and time-intensive for scientists to analyze. Our project will create a citizen science platform where local community members can help label footage from animal-mounted cameras and camera traps in Costa Rica. This effort will engage the public in ocean science and provide educational opportunities for local students while generating training data to develop machine learning models that efficiently process key imagery for marine research and conservation.", "k": ["citizen science", "ocean conservation", "machine learning", "education"], "e": "2025", "n": "Some skillsets that would be helpful are PR, web development, communications, education, oceans/engineering background - but excited to work with anyone interested!", "f": [{"n": "Jaden Clark", "y": "2025"}, {"n": "Daviana Berkowitz-Sklar", "y": "2024"}], "p": {"n": "Daviana Berkowitz-Sklar", "y": "2024"}, "u": "https://profiles.stanford.edu/daviana-berkowitz-sklar"}, {"t": "Patients in Artificial Intelligence Research (PAIR)", "c": "Healthcare and Life Sciences", "s": "Exploring ethical and experiential dimensions of AI-driven research involving human patients.", "d": "This project examines the evolving role of artificial intelligence in medical research involving human participants. Through research and discussions with patients, caregivers, clinicians, and researchers, we aim to understand ethical challenges, informed consent processes, and participant experiences. Our goal is to develop actionable recommendations and policies that ensure future AI research in healthcare remains human-centered, transparent, and ethically grounded.", "k": ["AI", "ethics", "informed consent", "patient experience", "healthcare"], "e": "2025", "n": "Graduate students with interest and expertise in human ethics and legal frameworks for research.", "f": [{"n": "Anson Zhou", "y": "2024"}], "p": {"n": "Anson Zhou", "y": "2024"}, "u": "https://profiles.stanford.edu/anson-zhou"}, {"t": "PhyStory", "c": "Education and Academia", "s": "Reconstructing the human story of physics through interactive timelines and animations that help educators teach not just what we know, but how we came to know it", "d": "Dark Matter. Black Holes. Quantum Entanglement. A physicist can tell you what these mysteries mean, but rarely how we came to know what they mean. That missing “how” – containing the blind alleys and serendipitous highways — can help educators show physics not as intimidating facts but as ideas shaped by curiosity and discovery. PhyStory makes the history of physics interactive—mining real historical archives to build timelines and animations that trace how discoveries unfolded. Unlike traditional resources, it lets teachers and students explore the actual experiments, debates, and turning points behind major theories, transforming physics from static knowledge into a story they can navigate and experience.", "k": ["physics", "science communication", "storytelling", "history of science", "interactive learning"], "e": "2025", "n": "Looking for collaborators with video production, animation, or AI-assisted content creation skills, as well as writers interested in storytelling and science communication. You don’t have to be a physicist—just curious about how ideas are discovered and how to bring them to life for learners and the public.", "f": [{"n": "Barkotel Zemenu", "y": "2024"}], "p": {"n": "Barkotel Zemenu", "y": "2024"}, "u": ""}, {"t": "Post-Status: Migrant Justice in the Era of Delegalization", "c": "NGO/ Nonprofit, Social Impact, and Advocacy", "s": "A collaborative project with Haitian community organizations to support the more than 300,000 Haitians affected by the end of Temporary Protected Status.", "d": "When Temporary Protected Status (TPS) for Haiti ended in the summer of 2026, more than 300,000 Haitians lost their legal status and work permits overnight, jeopardizing their families, jobs, and futures. This project partners with organizations working with Haitian communities to identify their most urgent needs (legal or otherwise) and to implement targeted, concrete support. Scholars in law, design, engineering, medicine, media, business, and other disciplines are invited to contribute their ideas and skills to support and empower one of the most overlooked migrant populations as they face great challenges.", "k": ["immigrant justice", "Haiti", "advocacy", "language access"], "e": "2026", "n": "We are looking for peers from any discipline who care about immigrant justice, or the Haitian community. We are looking for diverse perspective and background so we can develop the project together.\n\nHelpful skills include:\n- Research and interviewing for the needs assessment (social sciences, public health, education, design, business consulting)\n- Haitian Kreyòl or French fluency for translation, review, and community outreach (Spanish and Portuguese knowledge are also helpful)\n- Law and policy for Know Your Rights review, self-help materials, and legislative advocacy\n- Storytelling and media (writing, film, photography, social media), editing and design skills for advocacy campaigns", "f": [{"n": "Gil Joseph", "y": "2025"}], "p": {"n": "Gil Joseph", "y": "2025"}, "u": ""}, {"t": "Project Shire", "c": "Science, Technology and Engineering", "s": "Improving the VA disability claims process—building a user-friendly, AI-native solution that democratizes expert guidance and ensures veterans get the benefits they've earned.", "d": "The VA disability claims process forces veterans to choose between nebulous self-service options that lead to errors, incomplete claims, delays, and eventually expensive consultants for follow-up attempts. This project aims to build a modernized application that guides veterans through the entire claims journey via agentic interactions, automatically discovering claimable conditions, gathering evidence, populating complex VA forms, and connecting to expert human help all while educating and supporting the veteran every step of the way. The result is a transparent, easy-to-navigate alternative that gets veterans the benefits they've earned while creating a standardized intake process that reduces rework costs, speeds decisions, boosts VSO throughput, and relieves the VA’s backlog problem.", "k": ["veterans", "healthcare", "disability", "AI", "government"], "e": "2025", "n": "I am working with one other grad student who's mostly handling the BD (networking within VA and VSO orgs) and customer acquisition. I am handling the tech and am in the process of building an MVP--I'm seeking full-stack, conversational agent, and database experience to assist me. Also, anyone with experience in obtaining government contracts would be a plus!", "f": [{"n": "Luke Allard", "y": "2025"}], "p": {"n": "Luke Allard", "y": "2025"}, "u": ""}, {"t": "Rethinking Digital Life", "c": "Science, Technology and Engineering", "s": "How can technology invite a deeper sense of presence in everyday life?", "d": "Modern technologies are increasingly pulling our attention away from our immediate surroundings and into the digital world. From the endless scroll of social media feeds to immersive virtual experiences, these platforms often fragment our attention and pose growing risks to mental health and emotional well-being.\n\nIn this project, we aim to design, build, and share prototypes that explore how technology can support presence, connection, and well-being in everyday, real-world interactions. By drawing on expertise in engineering, arts, and human-centered design, we seek to raise awareness of how technology can be reimagined to foster more mindful and meaningful interactions.", "k": ["emerging technology", "well-being"], "e": "2024", "n": "Anyone welcome! Especially interested in exploring art installations as a medium to raise awareness of digital wellbeing and to engage audiences with new kinds of technologies that invite a deeper sense of presence in everyday life.", "f": [{"n": "Yujie Tao", "y": "2023"}], "p": {"n": "Yujie Tao", "y": "2023"}, "u": "https://profiles.stanford.edu/300472"}, {"t": "Science Communication with Art and Music (SCAM)", "c": "Art, Media, and Communications", "s": "Leveraging the communicative power of music and art to communicate science", "d": "How can the communicative powers of music and art be leveraged responsibly to enable meaningful and effective communication of scientific ideas?\nThe long-term goal is to develop a flexible curriculum for a course/workshop open to artists, scientists, and interdisciplinary researchers that focuses on creating communicative experiences that effectively blend art and science.", "k": ["Science communication", "education", "STEAM"], "e": "2026", "n": "I would really love input from STEM researchers (regardless of whether they have any interest in incorporating music/art into their science communication practice--as I am hoping the ideas in this course can be useful even in improving general science communication practice).Journalists and communicators would be a natural fit, and would really help me develop my ideas!I would love to co-develop this with people studying education (who understand how to adapt curricula to different age groups).Overall, I am still in the ideation phase and welcome people from any background!", "f": [{"n": "Walker Smith", "y": "2025"}], "p": {"n": "Walker Smith", "y": "2025"}, "u": ""}, {"t": "Secure & Local AI for Legal Aid Nonprofits", "c": "Government, Law, and Public Policy", "s": "A free, open-source AI toolkit that legal aid nonprofits can run entirely on their own devices so sensitive conversations their clients have with AI never reach a commercial frontier AI company's servers.", "d": "Legal aid nonprofits and the communities they serve, including immigrant communities navigating high-stakes, high-fear legal questions, increasingly turn to AI for guidance they can't otherwise afford, but every query carries concerning exposure. For example, a federal court ruled in February that AI chatbot conversations may not be protected by attorney-client privilege, and federal authorities have well-documented patterns of pursuing personal data from major tech platforms. We aim to develop a free, installable AI toolkit that runs entirely on a nonprofit's own devices, keeping sensitive conversations off frontier AI companies' servers, paired with a plain-language guide to the potential risks and options.", "k": ["legal aid", "immigrant communities", "AI privacy", "data sovereignty", "open-source AI"], "e": "2026", "n": "Looking for a technical co-lead comfortable packaging and testing open-source AI tools.", "f": [{"n": "Daishi Miguel-Tanaka", "y": "2025"}], "p": {"n": "Daishi Miguel-Tanaka", "y": "2025"}, "u": ""}, {"t": "SHTEM Summer Program (Science and Humanities)", "c": "NGO/ Nonprofit, Social Impact, and Advocacy", "s": "Building an in-person research pipeline at Stanford that connects high school and community college students with faculty mentors across science, technology, humanities, and engineering.", "d": "SHTEM is a selective summer program at Stanford that provides high school and community college students with early, hands-on exposure to research and innovation. By pairing students with faculty, graduate students, and postdocs, the program democratizes access to world-class research while emphasizing interdisciplinary exploration. Our goal is to transition the program from virtual to its first ever in-person session this summer as well as grow the program’s reach, ensure sustainability, and cultivate the next generation of diverse innovators and scholars.", "k": ["education", "research", "mentorship", "STEM", "access"], "e": "2025", "n": "We are in early growth planning and welcome a diverse range of expertise: from education program design, outreach, and nonprofit sustainability, to fundraising, marketing, and curriculum development. We’re especially interested in people with experience in communications and scaling educational programs.", "f": [{"n": "Rahul Penumaka", "y": "2024"}], "p": {"n": "Rahul Penumaka", "y": "2024"}, "u": "https://profiles.stanford.edu/rahul-penumaka"}, {"t": "Stanford Carceral Health Advocacy Initiative", "c": "NGO/ Nonprofit, Social Impact, and Advocacy", "s": "We seek to expand the reach and impact of a student-led initiative in which MD and PA students write medical testimony to support legal teams motioning for care parity and, when appropriate, compassionate release for patients in federal and state prisons.", "d": "In partnership with the Medical Justice Alliance, the School of Medicine’s Health Equity Education Program (under the guidance of Drs. Stephen Richmond and Nancy Ewen Wang), and the Haas Center for Public Service, our group (originally founded in 2022 by KHS alumna, Apoorva Rangan, and established as an elective course in 2024) writes medical testimonies to assist legal teams in motioning for care parity and, when appropriate, compassionate release for patients in federal and state prisons. We are now seeking to expand our impact beyond four student-led cases annually—at the level of direct impact, educational experience, and potentially advocacy. To that end, we are exploring expanding faculty and student participation to complete more cases, adding didactic content and experiences to support student learning, and exploring additional opportunities for impact, perhaps via advocacy or research.", "k": ["carceral justice", "health equity", "medical-legal partnership", "compassionate release", "service-learning"], "e": "2026", "n": "First and foremost, we would love to speak with law school classmates who can help provide perspective on the legal side of this work and help us think through how medical students and professionals can be successful advocates in the carceral justice space. We might also explore collaboration on didactic components of the course. Looking ahead, we would like to build strong partnership with the Law School. We would also appreciate guidance from anyone who has thought about building sustainable volunteer-run initiatives that balance big ambitions with reasonable expectations, as well as anyone who might be interested in program evaluation or policy-focused research or advocacy.", "f": [{"n": "Isaac Longobardi", "y": "2025"}, {"n": "Apoorva Rangan", "y": "2021"}], "p": {"n": "Isaac Longobardi", "y": "2025"}, "u": ""}, {"t": "Stanford Housing Equity Project", "c": "NGO/ Nonprofit, Social Impact, and Advocacy", "s": "The Stanford Housing Equity Project exists to connect the resources and personpower of universities to community partners in the Bay Area, empowering them to develop programs that advance housing and health equity for individuals experiencing homelessness – including by providing navigation for obtaining housing and social benefits, for unhoused and other socially at-risk individuals in the community.", "d": "Stable housing is the primary health determinant for unhoused individuals, yet they face complex barriers to securing housing and other essential benefits. SHEP exists to connect the resources and person-power of universities to Bay Area community partners, empowering them to develop programs that advance housing and health equity for individuals experiencing homelessness. SHEP members are undertaking a range of initiatives, including: Eye 4 Equity, SMOP, Recovery Incentives Project, UEO Direct Service, MED 219, MED 139, and Health EDU.", "k": ["Housing", "Case Management", "Public Benefits", "Health Equity"], "e": "2022", "n": "Working with unhoused and other socially at-risk populations, Understanding public benefit systems and application processes (for housing vouchers, SNAP, health insurance, ID applications, and others), Communicating with local organizations working on homelessness, Organizing community-based projects, Teaching students", "f": [{"n": "Tony Liu", "y": "2021"}], "p": {"n": "Aravind Krishnan", "y": "2025"}, "u": "https://profiles.stanford.edu/370897"}, {"t": "Surge On!: Capacity Building for Reconstructive Surgery in Subsaharan Africa", "c": "Healthcare and Life Sciences", "s": "Building capacity for reconstructive
