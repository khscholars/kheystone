 surgery in Sub-Saharan Africa", "d": "We will work with local reconstructive surgeons to build capacity for surgery in Sub-Saharan Africa. This will include surgical education, referral pathway development, patient education, patient retention, supporting research initiatives", "k": ["reconstructive surgery", "capacity building", "surgical education", "surgical access"], "e": "2026", "n": "We are seeking any one interested in reconstructive surgery. We also welcome anyone who has experience doing any form of capacity building locally in Sub-Saharan Africa that may be able to provide practical insight or tips/tricks on project execution. If there is something else you think you can add beyond the aforementioned, reach out!", "f": [{"n": "Afi Tagnedji", "y": "2024"}, {"n": "Meg Quint", "y": "2025"}], "p": {"n": "Afi Tagnedji", "y": "2024"}, "u": ""}, {"t": "The AI Trust Stack", "c": "Government, Law, and Public Policy", "s": "A project that explores how AI can help people trust each other more, by working with communities, tech builders, and policymakers to design and test real collaborative solutions.", "d": "Most conversations about AI focus on avoiding harm. We want to ask a different question: can AI actively help bring people together and strengthen democracy? We'll meet regularly with experts and community partners to test ideas for building trust inside groups and between groups, and we aim to produce practical tools, practices, or recommendations that organizations can actually use.", "k": ["AI", "trust", "democracy", "civic technology", "co-design"], "e": "2026", "n": "We are in early ideation and would like a diverse range of backgrounds. We are seeking mentors who can help us understand what case studies would be most impactful for us to work on building/researching.", "f": [{"n": "Mariana Rozo Paz", "y": "2026"}, {"n": "Peggy Yin", "y": "2026"}], "p": {"n": "Mariana Rozo Paz", "y": "2026"}, "u": ""}, {"t": "The Campus Survivors Project", "c": "Education and Academia", "s": "Working to reform campus and state policies to better support survivors of sexual violence.", "d": "This project aims to bring together advocates and shared expertise to design, implement, and advocate for better support systems for survivors of sexual violence on college campuses in California, including Stanford University, through Stanford Law School's Campus Survivors Pro Bono Project. Last year, we wrote and helped get a state bill passed, CA AB1928, which strengthened protections for over two million students across the state. We are dedicated to coordinating scholars to tackle an incredibly complex and often overlooked issue.", "k": ["education", "campus sexual violence", "advocacy", "policy", "law"], "e": "2025", "n": "I am looking for anyone who is interested! Especially those who have a trauma-informed background, experience in the prevention space, people with experience in policy design and higher education research, and communications including video-making and advocacy campaigns.", "f": [{"n": "David Millman", "y": "2024"}], "p": {"n": "David Millman", "y": "2024"}, "u": "https://profiles.stanford.edu/david-millman"}, {"t": "The Deservedness Project", "c": "Art, Media, and Communications", "s": "A project collecting stories of people living with stigmatized diseases, like obesity,  lung cancer, addiction, epilepsy, and endometriosis, to explore the surprising ways  shame and blame shape public health.", "d": "Shame is one of public health's oldest — and bluntest — tools. It has arguably driven down smoking and drunk driving, helping enforce social norms, but it also keeps people with lung cancer, addiction, and other illnesses from getting treated, while shaping policy through the language of \"personal responsibility.\" The Deservedness Project will record in-depth oral histories with patients, families, and clinicians to document the surprising ways shame shows up in illness. The ultimate goal is to help build a clearer public sense of where responsibility for health should begin and end.", "k": ["public health", "storytelling", "oral history", "philosophy"], "e": "2026", "n": "- Interviewers comfortable with difficult conversations (any field, including those in medicine, psychology, social work, anthropology)\n- Photographers to take in-person portraits\n- Scholars in law, philosophy, or ethics to help define the metes and bounds of shame in medicine — and what \"deserved\" means\n- People with lived experience of or ties to communities affected by stigmatized illnesses", "f": [{"n": "Simar Bajaj", "y": "2026"}], "p": {"n": "Simar Bajaj", "y": "2026"}, "u": "https://profiles.stanford.edu/simar-bajaj"}, {"t": "The Digital Scalpel: Artificial Intelligence & Surgery", "c": "Science, Technology and Engineering", "s": "An interdisciplinary working group focused on assessing the capabilities and limitations of AI technologies in surgery, studying those currently in use and contributing to future AI innovations.", "d": "AI has the potential to enhance all stages of surgical care, from clinical reasoning and surgical planning to intra- and post-operative strategy. Tools like OpenEvidence have been adopted by hundreds of thousands of physicians. We will explore the impact, expected and unexpected, of AI technologies in advancing surgical care and potentially creating more equitable access to the best treatments. We aim to identify areas for future growth where we can contribute through novel initiatives.", "k": ["surgery", "artificial intelligence", "healthcare"], "e": "2025", "n": "I'm looking for people who are passionate about AI and surgery coming from a variety of backgrounds, such as CS, medicine, law, policy, and engineering. Open to mentors and partnerships.", "f": [{"n": "Umar Siddiqi", "y": "2024"}], "p": {"n": "Umar Siddiqi", "y": "2024"}, "u": "https://profiles.stanford.edu/umar-siddiqi"}, {"t": "The Mitigation Project", "c": "Government, Law, and Public Policy", "s": "Partnering with public defenders to challenge prolonged correctional control and build compelling cases for sentence reductions and early termination of parole and supervised release in order to address mass incarceration.", "d": "This project aims to reduce the number of individuals under correctional control by building a pipeline that connects community members in East Palo Alto and the broader San Francisco Bay Area with guidance and resources to pursue early termination of supervised release.\n\nWe will also partner with public defender offices in the San Francisco Bay Area to support sentencing mitigation and early termination efforts, helping attorneys develop compelling cases for reduced sentences and the termination of supervised release, ultimately reducing the number of people under correctional control.", "k": ["Criminal Justice", "Advocacy", "Community-Building"], "e": "2026", "n": "I'm in the early ideation phase and want as diverse a range of backgrounds as possible. However, it would be helpful to have mentors and members who could contribute to these roles:\n\n### Legal / policy research\n- Understand early-termination laws and procedures\n- Research eligibility and legal barriers\n- Track outcomes and policy implications\n\n### Public defender / litigation support\n- Work directly with defense attorneys\n- Help identify and develop mitigation evidence\n- Draft or organize materials for motions and sentencing advocacy\n\n### Client storytelling / mitigation\n- Interview clients and community members\n- Develop compelling narratives\n- Create letters, photographs, videos, timelines, and exhibits that humanize the client beyond the conviction\n\n### Community outreach\n- Build relationships with East Palo Alto and Bay Area organizations\n- Create a referral pipeline\n- Make the project accessible to people who may not already have attorneys\n\n### Project management / evaluation\n- Coordinate attorneys, community partners, and students\n- Build the toolkit and referral system\n- Track cases, outcomes, and ultimately months of supervision eliminated", "f": [{"n": "Ank Agarwal", "y": "2024"}], "p": {"n": "Samantha Taylor", "y": "2025"}, "u": ""}, {"t": "The Prison Law Journal Project", "c": "NGO/ Nonprofit, Social Impact, and Advocacy", "s": "Building Bridges Between Justice-Impacted Scholars, Law Students, and Legal Academics", "d": "In recent years, scholars, practitioners, and activists alike have called for integrating the voices, perspectives, and knowledge of justice-impacted people in legal scholarship.  This project seeks to bring this framework to life through a special edition of a flagship law journal. Comprising essays written by noted scholars of criminal and constitutional law alongside those written by incarcerated Americans, this publication positions the prison as a site of knowledge production.", "k": ["law", "incarceration", "scholarship"], "e": "2026", "n": "We'd love marketing expertise, publishing experience, or experience working with incarcerated authors and justice-impacted people.", "f": [{"n": "Carson Eckhard", "y": "2025"}], "p": {"n": "Carson Eckhard", "y": "2025"}, "u": ""}, {"t": "The Traumatic Injury Collaborative", "c": "Healthcare and Life Sciences", "s": "An interdisciplinary community for education, research, and advocacy dedicated to reshaping how we understand, prevent, and treat traumatic injury.", "d": "Traumatic injury is a profound global challenge that requires a coordinated response connecting scientific discovery, clinical innovation, and public action. This project will unite scholars across disciplines to examine barriers to progress, build consensus around promising opportunities, and develop partnerships to improve injury prevention and care.", "k": ["traumatic injury", "injury prevention", "interdisciplinary", "responsible innovation", "equity"], "e": "2026", "n": "We are in an early building and ideation phase and want as diverse a range of backgrounds as possible. We are looking for students, collaborators, mentors, advocates, and anyone else interested in creating a community that reshapes the narrative around traumatic injury.", "f": [{"n": "Kush Narang", "y": "2026"}], "p": {"n": "Kush Narang", "y": "2026"}, "u": ""}, {"t": "Through Their Eyes: Pediatric Photography Project", "c": "Art, Media, and Communications", "s": "Amplifying the voices of pediatric patients and parents by using photography and art to share their experiences with illness in galleries, publications, and workshops worldwide", "d": "We partner with pediatric patients and their parents, giving them cameras and other supplies to help them document their unique experiences with health and illness. Together, we identify the images that hold the most meaning and explore the stories behind them. Over the past four years, our participants have captured hundreds of photos featured in galleries, publications, and conferences, we’ve led two international workshops, and we continue to expand this work’s reach and impact.", "k": ["storytelling", "medical humanities", "patient empowerment", "health", "illness"], "e": "2021", "n": "We welcome team members from all backgrounds—engineers, film and media students, policy students, medical trainees, and beyond. Our only requirement is excitement about giving patients and families a platform to share their stories through creative expression. Whether you’re interested in storytelling, design, research, or simply passionate about humanizing healthcare, there’s a place for you on our team!", "f": [{"n": "Niisoja Torto", "y": "2021"}], "p": {"n": "Aaron Abai", "y": "2024"}, "u": "https://profiles.stanford.edu/aaron-abai"}, {"t": "Tiny Pharma", "c": "Science, Technology and Engineering", "s": "Interdisciplinary and environmental justice oriented approaches to drug discovery and pharmaceutical research for mental health", "d": "Drug discovery and pharmaceutical research has historically come at the expense of harm to local and indigenous communities and environmental systems. What would it look like to design a drug development and therapeutics research pipeline where environmental sustainability and respect for community needs and sovereignty are core values? This project will challenge norms of extractive research in the development of mental health therapeutics. We will draw from interdisciplinary approaches across the humanities and STEM fields to envision new, respectful, ways to find and create medicines.", "k": ["Interdisciplinary collaboration", "Drug discovery", "Mental health", "Sustainability", "Socio-ecological systems"], "e": "2025", "n": "1-2 team members", "f": [{"n": "Marina Luccioni", "y": "2024"}], "p": {"n": "Marina Luccioni", "y": "2024"}, "u": "https://profiles.stanford.edu/marina-luccioni"}, {"t": "Upchaar", "c": "NGO/ Nonprofit, Social Impact, and Advocacy", "s": "A multidisciplinary initiative creating a streamlined pipeline from biomedical discovery to real-world deployment, ensuring that cost-effective, evidence-based therapeutics reach low-resource communities globally.", "d": "Upchaar bridges the gap between biomedical innovation and healthcare accessibility in low-resource settings by developing, adapting, and implementing cost-effective therapeutic solutions. Through collaborations with researchers, clinicians, and policymakers, the project optimizes promising interventions for affordability, scalability, and sustainability. In parallel, Upchaar builds local capacity through education, training, and policy advocacy—ensuring that groundbreaking scientific advances translate into equitable healthcare impact on the ground.", "k": ["global health", "therapeutics", "innovation pipeline", "accessibility", "healthcare equity"], "e": "2024", "n": "We are seeking team members with expertise in biomedical engineering, public health, implementation science, education, and policy communication. Experience in design thinking, data visualization, or healthcare entrepreneurship would also be valuable as we scale Upchaar’s innovation-to-impact model. Enthusiastic learners from diverse disciplines are welcome, the more perspectives, the stronger the solutions!", "f": [{"n": "Kritika Singh", "y": "2024"}], "p": {"n": "Kritika Singh", "y": "2024"}, "u": "https://profiles.stanford.edu/kritika-singh"}, {"t": "Varieties of Cyborg Experience", "c": "Art, Media, and Communications", "s": "Documenting the impact of transformative technologies on individual lived experiences.", "d": "This video series aims to capture emerging human experiences (e.g. the restoration of sight) that are resulting from the unique interactions between new technologies and their first users.", "k": ["emerging technologies", "storytelling", "ethics"], "e": "2026", "n": "Our team members have connections with labs, but also connections with industry and mentorship on how to do this ethically and consent forms etc would be helpful", "f": [{"n": "Savannah Cofer", "y": "2020"}, {"n": "Peggy Yin", "y": "2026"}], "p": {"n": "Peggy Yin", "y": "2026"}, "u": "https://profiles.stanford.edu/peggy-yin"}, {"t": "vidyoo.ai | A Democratized Data Collection Platform", "c": "Science, Technology and Engineering", "s": "A marketplace platform to democratize data collection and annotation to everyone in the world.", "d": "Data has become such a scarce resource, especially with the upcoming physical AI and robotics era. However, the world is rife with collection and misuse of personal data. At an average cost of $6,563 per person annually, a dataset of 100 million Americans generates roughly $650 billion per year in commercial value. For the rest of the world, the data of 1 billion people generates $265 billion per year. With vidyoo.ai, we allow everyday people to own and record their own video data and sell this directly to model companies for training purposes. Imagine this platform as an Uber for data. With the huge influx of a need for various datasets by model companies to train various types of models, from large language models (LLMs), large video models (LVMs), vision language action models, (VLAs), and large world models (LWMs). These per hour data include virtual gaming (i.e. RPGs), real-world environment data (i.e. hikes, city strolls, dash cam data feed, etc.), egocentric data (i.e. wearables at work), and teleoperation data (i.e. humans operating robots). With vidyoo.ai, anyone can become their own independent video collector, and have a platform to just upload a video feed, and vidyoo.ai does the job of annotating, cleaning, bulking, and selling this data to potential buyers. This would democratize and trickle down income potential of this AI revolution to gig workers and everyday customers. Over the past few years, large-scale data collectors and tele-operator companies have been extracting the value from this huge appetite for data. However, with vidyoo.ai, we are able to bring the income potential for data collection straight to the individual.", "k": ["AI", "Fin tech", "Consumer tech", "Robotics", "Developing Markets", "Equity & Access"], "e": "2026", "n": "", "f": [{"n": "Kyle Kua", "y": "2025"}], "p": {"n": "Kyle Kua", "y": "2025"}, "u": "https://profiles.stanford.edu/kyle-kua"}, {"t": "Warmth Through Words", "c": "Art, Media, and Communications", "s": "Helping people build warmer, more personal connections across language barriers and cultures by teaching a manageable set of practical phrases in many languages", "d": "Simply speaking a few phrases in someone’s native language can help them feel more comfortable, welcomed, and connected, enabling interactions to feel warmer and making it easier to build trust and bond with others, especially in healthcare. Warmth Through Words will create free, accessible flashcard decks teaching approximately 20 practical phrases in many different languages/dialects for use in healthcare and everyday interactions. Each deck will be developed with native speakers, include audio recordings at both natural and slowed speeds, and be reviewed by additional native speakers for accuracy and naturalness.", "k": ["language learning", "cross-cultural connection", "community-building", "belonging", "healthcare"], "e": "2026", "n": "We are especially interested in team members who are native or highly fluent speakers of different languages and can help translate, adapt, record, and review phrases. We would also welcome people with experience in healthcare communication, communication for education, UI/UX, and audio production (recording especially).", "f": [{"n": "Ank Agarwal", "y": "2024"}], "p": {"n": "Ank Agarwal", "y": "2024"}, "u": "https://profiles.stanford.edu/ank-agarwal"}, {"t": "Who Gets Space?", "c": "Government, Law, and Public Policy", "s": "A public-interest research and media project investigating how the commercialization of space is shifting infrastructure, resources, security, and power, and translating what those changes mean for everyday people through interdisciplinary case studies, articles, and accessible digital media.", "d": "Who Gets Space? is an interdisciplinary research and public-interest media project examining how the rapid commercialization of space is changing who controls critical infrastructure, resources, information, and decision-making power.\n\nOur team will develop 5–6 case studies on major shifts in the space industry and translate that research into politically neutral, public-facing articles and short-form media for people outside of aerospace. The goal is not to tell people what to think, but to give them the facts, context, tradeoffs, and perspectives they need to understand how these changes could affect their lives and form their own opinions about the future of space.", "k": ["pace policy", "commercialization of space", "technology and society", "public-interest journalism", "global governance"], "e": "2026", "n": "I would love as diverse a range of backgrounds as possible! Definitely no aerospace experience required. I would especially love people interested in policy, law, international relations, business, economics, sustainability, ethics, education, communications, social science, or technology and society.I think the whole point of this project is that people from very different fields will look at the same questions about space and notice completely different things.", "f": [{"n": "Sabrina Nicacio", "y": "2025"}], "p": {"n": "Sabrina Nicacio", "y": "2025"}, "u": "https://profiles.stanford.edu/snicacio"}]</script>

  const P = JSON.parse(document.getElementById('app-data').textContent);
  const CAT_VAR = {
    "Art, Media, and Communications":"--c-art","Education and Academia":"--c-edu",

    "Science, Technology and Engineering":"--c-sci","Healthcare and Life Sciences":"--c-hc",

  const CAT_ORDER = Object.keys(CAT_VAR);
  const cc = c => `var(${CAT_VAR[c]||'--c-other'})`;
  const esc = s => String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const slugify = t => 'p-' + t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60);
  const seen = {};
  P.forEach(p=>{ let s=slugify(p.t); if(seen[s]) s+='-'+(++seen[s]); else seen[s]=1; p.id=s; });
  const BY_ID = Object.fromEntries(P.map(p=>[p.id,p]));
  const STN = {"Backcurrent Innovation": "DR32", "Beyond Combustion: Methane to Materials": "CR15", "Beyond Degrees: Closing the Racial Wealth Gap Through Higher Education": "DR14", "Beyond the Fields: The Lives Behind Our Food": "CR13", "BioSentinel - Biosafety in the age AI": "DR33", "Cards 4 Kids": "DR34", "Clean Closet: Explorations in Affordable, Non-Toxic, Sustainable Fashion": "CR16", "D.Sole Foundation: Diabetic Footcare for Underserved Communities": "CR3", "Deep Cuts": "DR24", "Despegar Fellows": "DR9", "Dialekt": "CR4", "EconStats.org": "DR16", "epidemiKH": "DR36", "Equal Depths": "CR2", "Every Phase: Supporting Mothers Through Change": "DR37", "Exploring Vaccine Hesitancy in the Perinatal Period": "CR5", "Field of View": "DR1", "First Teachers": "DR10", "Global Neurosurgery Collaborative": "CR6", "GOAL @ Stanford: Gyn/Ob Advocacy Lab": "DR38", "Hardening Critical Infrastructure: Lessons from Ukraine": "DR27", "Ideas That Travel": "DR2", "Improving Birth Outcomes through Multiomic and Vaginal Microbiome Profiling": "DR39", "Infrastructure for Her: Advancing Gender-Responsive Mobility in Monterrey, Mexico": "DR15", "Intelligence KHollective": "DR23", "Intersex Community Health Coalition": "DR40", "KHnowledge & Policy": "DR17", "Know Your Water": "DR18", "Learn to Discern: Building Educational Tools to Teach Digitial Literacy Skills in the Age of AI": "CR14", "Life and Career Design for High School Students": "DR11", "Local AI Lab": "DR26", "MedBridge: Building Physician–Scientists in the Americas": "CR7", "Mentorship in Academia Project": "DR12", "Mind Matters: Empowering Teachers for Youth Mental": "DR13", "Neurodiversity Network": "CR1", "Next Play": "DR31", "Ojos del Mar": "CR8", "Post-Status: Migrant Justice in the Era of Delegalization": "CR10", "Project Shire": "DR28", "Rethinking Digital Life": "DR29", "Science Communication with Art and Music (SCAM)": "DR4", "Secure & Local AI for Legal Aid Nonprofits": "DR19", "SHTEM Summer Program (Science and Humanities)": "CR9", "Stanford Carceral Health Advocacy Initiative": "CR11", "Stanford Housing Equity Project": "CR12", "Surge On!: Capacity Building for Reconstructive Surgery in Subsaharan Africa": "DR41", "The AI Trust Stack": "DR20", "The Campus Survivors Project": "DR7", "The Deservedness Project": "DR5", "The Mitigation Project": "DR21", "The Traumatic Injury Collaborative": "DR35", "Through Their Eyes: Pediatric Photography Project": "DR6", "Tiny Pharma": "DR30", "Varieties of Cyborg Experience": "DR8", "vidyoo.ai | A Democratized Data Collection Platform": "DR25", "Warmth Through Words": "DR3", "Who Gets Space?": "DR22"};
  const sortKey = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const AZ = P.slice().sort((a,b)=>sortKey(a.t).localeCompare(sortKey(b.t)));
  const firstLetter = p => { const c=sortKey(p.t).charAt(0).toUpperCase(); return /[A-Z]/.test(c)?c:'#'; };
  const view = document.getElementById('view');
  let query = '';
  const INTRO = `<p class="intro">KHeystone Projects are year-long, scholar-led collaborations aimed at addressing important regional or global issues. Each autumn quarter, Knight-Hennessy scholars present ideas for a KHeystone Project at the annual Ideas Festival. Scholars then form multidisciplinary project teams — sometimes aligned to their field of study, sometimes completely different.</p>`;

  function matches(p){
    if(!query) return true;
    const q = query.toLowerCase();
    return [p.t,p.s,p.d,p.k.join(' '),p.c,p.n||'',(p.f||[]).map(x=>x.n).join(' '),p.p?p.p.n:''].join(' ').toLowerCase().includes(q);
  }
  function toolbar(n){
    return `<div class="toolbar"><label class="search" for="q"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="Search projects, people, keywords, skills" value="${esc(query)}" autocomplete="off"></label><span class="count" id="count">${n} of ${P.length} projects</span></div>`;
  }
  function bindSearch(rerender){
    const q=document.getElementById('q');
    q.addEventListener('input',()=>{query=q.value; rerender(true);});
  }
  function setTab(t){ document.querySelectorAll('nav.tabs a').forEach(a=>a.toggleAttribute('aria-current',a.dataset.tab===t)); document.querySelectorAll('nav.tabs a').forEach(a=>{ if(a.dataset.tab===t) a.setAttribute('aria-current','page'); }); }

  function renderAZ(keepFocus){
    const list = AZ.filter(matches);
    const groups = {};
    list.forEach(p=>{(groups[firstLetter(p)] ||= []).push(p);});
    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    const jump = `<div class="jump" aria-label="Jump to letter">${letters.map(L=>groups[L]?`<a href="#az-${L}" data-jump="${L}">${L}</a>`:`<span>${L}</span>`).join('')}</div>`;
    const body = Object.keys(groups).sort().map(L=>`<h2 class="letter" id="az-${L}">${L}</h2><ul class="list">${groups[L].map(p=>`<li><a class="row" href="#${p.id}" style="--cc:${cc(p.c)}"><span class="dot" aria-hidden="true"></span><span class="t">${esc(p.t)}</span><span class="s">${esc(p.s)}</span><span class="cat">${esc(p.c)}</span></a></li>`).join('')}</ul>`).join('') || `<p class="empty"><strong>No projects match “${esc(query)}”</strong>Try a different word or clear the search.</p>`;
    paint(toolbar(list.length)+jump+body, keepFocus, renderAZ);
    view.querySelectorAll('[data-jump]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();document.getElementById('az-'+a.dataset.jump).scrollIntoView({behavior:'smooth',block:'start'});}));
  }
  function renderCats(keepFocus){
    const list = P.filter(matches);
    const cats = CAT_ORDER.filter(c=>list.some(p=>p.c===c)).concat([...new Set(list.map(p=>p.c))].filter(c=>!CAT_VAR[c]));
    const sec=(c,i)=>{const ps=list.filter(p=>p.c===c).sort((a,b)=>sortKey(a.t).localeCompare(sortKey(b.t)));return `<section style="--cc:${cc(c)};order:${i}"><h2><span class="dot" aria-hidden="true"></span>${esc(c)}<span class="n">${ps.length}</span></h2><ul>${ps.map(p=>`<li><a href="#${p.id}">${esc(p.t)}</a></li>`).join('')}</ul></section>`;};
    // three stacked columns: categories go left, center, right in order; any leftovers go in the center column
    const cols=[[],[],[]]; const full=Math.floor(cats.length/3)*3;
    cats.forEach((c,i)=>{ (i<full ? cols[i%3] : cols[1]).push(sec(c,i)); });
    const body = cats.length ? `<div class="cats">${cols.map(s=>`<div class="stack">${s.join('')}</div>`).join('')}</div>` : `<p class="empty"><strong>No projects match “${esc(query)}”</strong>Try a different word or clear the search.</p>`;
    const MAPCARD = `<a class="mapcard" href="#table-map"><img src="table-map-thumb.png" alt="Mini table map of the Dining Room and Classroom"><div><b>Ideas Festival table map</b><span>Find any project's table in the Dining Room or Classroom, with a full list of table numbers.</span><em>View the table map &rarr;</em></div></a>`;
    paint(INTRO+MAPCARD+toolbar(list.length)+body, keepFocus, renderCats);
  }
  function paint(html, keepFocus, rerender){
    const pos = keepFocus ? document.getElementById('q')?.selectionStart : null;
    view.innerHTML = html;
    bindSearch(rerender);
    if(keepFocus){const q=document.getElementById('q');q.focus();try{q.setSelectionRange(pos,pos);}catch(e){}}
  }
  // light formatting: "- " lines become bullets, "### " lines become small headings, **text** is bold
  function inline(x){ return esc(x).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); }
  function paras(t){
    const out=[]; let list=null;
    t.split('\n').map(x=>x.trim()).forEach(line=>{
      if(/^[-•]\s+/.test(line)){ (list||(list=[])).push(`<li>${inline(line.replace(/^[-•]\s+/,''))}</li>`); return; }
      if(list){ out.push(`<ul>${list.join('')}</ul>`); list=null; }
      if(!line) return;
      if(line.startsWith('### ')) out.push(`<p class="sub">${inline(line.slice(4))}</p>`);
      else out.push(`<p>${inline(line)}</p>`);
    });
    if(list) out.push(`<ul>${list.join('')}</ul>`);
    return out.join('');
  }
  function person(x){
    const name = x.u ? `<a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.n)}</a>` : esc(x.n);
    return `<span class="who">${name}${x.y?`<span class="yr">${esc(x.y)} cohort</span>`:''}</span>`;
  }
  function facts(p){
    const rows=[];
    if(p.p) rows.push(['Project manager', person({...p.p, u:p.u})]);
    if(p.f&&p.f.length) rows.push([p.f.length>1?'Founders':'Founder', p.f.map(f=>person(p.p&&f.n===p.p.n?{...f,u:p.u}:f)).join('')]);
    if(STN[p.t]) rows.push(['Ideas Festival table', `<a class="tno tpill" href="#table-map" style="--cc:${cc(p.c)}" title="See the table map">${esc(STN[p.t])}</a><span class="yr">${STN[p.t].startsWith('DR')?'Dining Room':'Classroom'}</span>`]);
    if(p.e) rows.push(['Established', esc(p.e)]);
    return rows.length?`<dl class="facts">${rows.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`:'';
  }
  function renderProject(p){
    const i = AZ.indexOf(p), prev = AZ[i-1], next = AZ[i+1];
    view.innerHTML = `<nav class="crumbs" aria-label="Breadcrumb"><a href="#">By category</a><span aria-hidden="true">/</span><a href="#a-z">A to Z</a></nav>
      <article style="--cc:${cc(p.c)}">
        <a class="chip" href="#"><span class="dot" aria-hidden="true"></span>${esc(p.c)}</a>
        <h2>${esc(p.t)}</h2>
        ${p.s?`<p class="lede">${esc(p.s)}</p>`:''}
        <p class="connect"><a class="connect-btn" href="https://docs.google.com/forms/d/e/1FAIpQLSdd0upfXTFJkC5SKX7fuA5PVN0JAlwXkIegBchWx8dLi4Je-A/viewform?usp=pp_url&entry.173286245=${encodeURIComponent(p.t)}" target="_blank" rel="noopener">Connect with this project <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5"/></svg></a><span>Mentor, join, or partner with the team.</span></p>
        ${facts(p)}
        ${p.d?`<p class="label">About the project</p><div class="desc">${paras(p.d)}</div>`:''}
        ${p.n?`<p class="label">Skills the team is looking for</p><div class="desc">${paras(p.n)}</div>`:''}
        ${p.k.length?`<p class="label">Keywords</p><ul class="kw">${p.k.map(k=>`<li>${esc(k)}</li>`).join('')}</ul>`:''}
      </article>
      <nav class="pager" aria-label="More projects">${prev?`<a href="#${prev.id}"><small>Previous</small><span>${esc(prev.t)}</span></a>`:'<span></span>'}${next?`<a class="next" href="#${next.id}"><small>Next</small><span>${esc(next.t)}</span></a>`:''}</nav>`;
  }

  function glossary(){
    const items=AZ.filter(p=>STN[p.t]);
    const num=s=>(s.startsWith('DR')?0:1000)+parseInt(s.slice(2));
    const li=p=>`<li><a href="#${p.id}"><span class="tno" style="--cc:${cc(p.c)}">${esc(STN[p.t])}</span><span class="tnm">${esc(p.t)}</span></a></li>`;
    const byRoom=(pre)=>items.filter(p=>STN[p.t].startsWith(pre)).sort((a,b)=>num(STN[a.t])-num(STN[b.t]));
    return `<section class="gloss"><h2>Find a table</h2><p class="note">${items.length} project tables. Select a project to open its page.</p>
      <div class="gtabs" role="tablist"><button type="button" class="on" data-g="az">A to Z</button><button type="button" data-g="num">By table number</button></div>
      <div data-gv="az"><ul class="glist">${items.map(li).join('')}</ul></div>
      <div data-gv="num" hidden><h3>Dining Room</h3><ul class="glist">${byRoom('DR').map(li).join('')}</ul><h3>Classroom</h3><ul class="glist">${byRoom('CR').map(li).join('')}</ul></div></section>`;
  }
  function wireGloss(){
    document.querySelectorAll('.gtabs button').forEach(b=>b.addEventListener('click',()=>{
      document.querySelectorAll('.gtabs button').forEach(x=>x.classList.toggle('on',x===b));
      document.querySelectorAll('[data-gv]').forEach(v=>v.hidden=v.dataset.gv!==b.dataset.g);
    }));
  }
  function renderMap(){
    // Standalone version: the map is the file "table-map.png" in the same folder as this page.
    // To update it, replace that file. If it's missing, the page shows "coming soon".
    const legend = `<div class="legend">${CAT_ORDER.map(c=>`<span><i class="dot" style="--cc:${cc(c)}"></i>${esc(c)}</span>`).join('')}</div>`;
    view.innerHTML = `<div class="mapbox"><img src="table-map.png" alt="Table map for the KHeystone Ideas Festival at Denning House, showing project tables by category" id="mapimg">${legend}</div>${glossary()}`;
    wireGloss();
    const img=document.getElementById('mapimg');
    img.addEventListener('error',()=>{ document.querySelector('.mapbox').outerHTML=`<div class="empty"><strong>Table map coming soon</strong>The map of project tables will be posted here before the Ideas Festival.</div>`; });
  }
  function route(){
    const h = decodeURIComponent(location.hash.replace(/^#/,''));
    if(h===''||h==='categories'){ setTab('categories'); renderCats(); document.title='KHeystone Project Directory'; }
    else if(h==='a-z'){ setTab('az'); renderAZ(); document.title='A to Z · KHeystone Project Directory'; }
    else if(h==='table-map'){ setTab('table-map'); renderMap(); document.title='Table map · KHeystone Project Directory'; }
    else if(BY_ID[h]){ setTab(''); renderProject(BY_ID[h]); document.title=BY_ID[h].t+' · KHeystone Project Directory'; window.scrollTo(0,0); }
    else if(h.startsWith('az-')){ return; }
    else { setTab('categories'); renderCats(); document.title='KHeystone Project Directory'; }
  }
  window.addEventListener('hashchange',route);
  route();
})();
</script>

</body>
</html>
